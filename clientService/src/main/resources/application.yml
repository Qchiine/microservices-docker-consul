server:
  port: 8088
  error:
    include-message: always

spring:
  application:
    name: SERVICE-CLIENT
  datasource:
    # En Docker : "mysql" est le nom DNS du conteneur (PAS localhost).
    # En local, SPRING_DATASOURCE_URL est surcharge par le profil.
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/Micro_ClientDB?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      initialization-fail-timeout: -1
      connection-timeout: 10000
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
  cloud:
    consul:
      host: ${SPRING_CLOUD_CONSUL_HOST:localhost}
      port: ${SPRING_CLOUD_CONSUL_PORT:8500}
      discovery:
        enabled: ${SPRING_CLOUD_CONSUL_DISCOVERY_ENABLED:true}
        instance-id: ${spring.application.name}:${server.port}
        service-name: ${spring.application.name}
        health-check-path: /actuator/health
        health-check-interval: 10s
        health-check-timeout: 4s
        health-check-critical-timeout: 30s
        prefer-ip-address: true
        tags:
          - team=fleetops
          - tier=data
    discovery:
      enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true

info:
  app:
    name: SERVICE-CLIENT
    discovery: consul
    tp: "TP 25 - Conteneurisation Docker + Consul"
